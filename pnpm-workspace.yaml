packages:
  - apps/*
  - packages/*

# Single source of dependency versions. Every workspace package declares
# "catalog:" and gets the version below, so two packages can never drift.
catalog:
  # tooling
  turbo: ^2.11.10
  # Two TypeScripts, on purpose (same split as the reference monorepo).
  # `typescript-native` is TS 7, the compiler: every build and typecheck
  # script runs it by path, because its bin is also named `tsc`.
  # `typescript` stays on 5.9 as the JavaScript API that typescript-eslint,
  # knip and Next's build-time check load; TS 7.0 has no stable API yet.
  typescript: ^5.9.3
  typescript-native: npm:typescript@^7.0.2
  '@types/node': ^22.20.5
  prettier: ^3.9.10
  knip: ^6.43.0
  rimraf: ^6.1.3
  tsx: ^4.23.15
  # Bundles the MCP Apps views into one self-contained script each.
  esbuild: ^0.28.2
  # lint
  eslint: ^10.13.0
  '@eslint/js': ^10.0.1
  typescript-eslint: ^8.72.0
  eslint-plugin-boundaries: ^7.4.0
  eslint-import-resolver-typescript: ^4.4.5
  eslint-config-prettier: ^10.1.8
  eslint-plugin-react-hooks: ^7.1.1
  '@next/eslint-plugin-next': ^16.4.3
  globals: ^17.13.0
  # test
  vitest: ^5.0.5
  '@vitest/coverage-v8': ^5.0.5
  jsdom: 29.1.1
  '@testing-library/react': 16.3.3
  '@testing-library/dom': 10.4.2
  '@testing-library/user-event': 14.6.8
  '@testing-library/jest-dom': 7.0.1
  unplugin-swc: ^2.0.0
  '@swc/core': 1.16.20
  # contracts
  zod: ^4.6.7
  # backend
  '@nestjs/core': ^12.2.0
  '@nestjs/common': ^12.2.0
  '@nestjs/platform-fastify': ^12.2.0
  '@nestjs/testing': ^12.2.0
  fastify: ^5.12.7
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  jose: ^6.2.13
  # MCP TypeScript SDK v2 (spec 2026-07-28, stateless per-request servers) and the
  # MCP Apps extension (interactive UI widgets). v2 split the v1 `sdk` package.
  '@modelcontextprotocol/server': ^2.4.0
  '@modelcontextprotocol/client': ^2.4.0
  '@modelcontextprotocol/ext-apps': ^2.0.4
  # data
  drizzle-orm: ^0.45.4
  drizzle-kit: ^0.31.11
  '@libsql/client': ^0.18.0
  # scheduling (spec 6, ADR 0007). 5.x because 6.x requires Node 24 and we support Node 22
  ts-fsrs: ^5.4.2
  # web
  # 16.4.5 is the security release (7 advisories, incl. GHSA-pc58-hwjq-p385 on
  # forwarded fetch responses, which /api/v1 does). Pinned; see the age exclusions below.
  next: 16.4.5
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  next-intl: ^4.14.9
  react-hook-form: ^7.91.0
  '@hookform/resolvers': ^6.0.0
  '@tanstack/react-query': ^5.105.0
  '@supabase/supabase-js': ^2.118.0
  '@supabase/ssr': ^0.12.7
  tailwindcss: ^4.3.3
  '@tailwindcss/postcss': ^4.3.3
  postcss: ^8.5.31
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  class-variance-authority: ^0.7.1
  radix-ui: ^1.8.1

# Supply chain and portability: a version must be public for 21 days (in
# minutes) before it is installed. A hijacked release is usually caught by
# then, and offline mirrors (CI caches, sandboxed build machines) that lag
# behind the registry by two weeks still have every pinned version.
minimumReleaseAge: 30240

# Security patches are installed as soon as they ship, not after 21 days.
# Each entry names the advisory it closes; remove it once the pin is older
# than the window above.
minimumReleaseAgeExclude:
  - next # GHSA-mfr8-8qww-v76h and six more, fixed in 16.4.5
  - '@next/env'
  - '@next/swc-*'

# Supply chain: only these dependencies may run install scripts. They compile
# or fetch native binaries; everything else is denied by default.
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - unrs-resolver
  - sharp
  # next-intl's message watcher: the script only picks a prebuilt binary.
  - '@parcel/watcher'
